; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#v2.3.5
    adafruit/Adafruit BNO08x @ ^1.2.5
    https://github.com/stm32duino/VL53L8CX.git#2.1.0

build_flags =
    -I src
    ; Serial TX ring buffer (default 64 B). With 64 B every status line
    ; blocks the main loop - and loopFOC - for ~15 ms until it is sent;
    ; 2 KB lets prints go out in the background via interrupts.
    -D SERIAL_TX_BUFFER_SIZE=2048

; NEW: keep the test folder out of the normal firmware build
build_src_filter = +<*> -<tests/>


; NEW: separate environment that builds only the encoder test
[env:encoder_test]
extends = env:nucleo_f446re
build_src_filter = -<*> +<tests/EncoderTest.cpp>